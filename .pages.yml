media:
  - name: photos
    label: 기사 사진
    input: public/media/uploads
    output: /media/uploads
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: papers
    label: 신문 PDF
    input: public/files
    output: /files
    extensions: [pdf]
    rename: safe
content:
  - name: articles
    label: 기사 작성·수정
    type: collection
    path: content/articles
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, category, date, status, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 기사 제목
        type: string
        required: true
      - name: slug
        label: 기사 주소 (영문·숫자·하이픈)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: 예) school-festival-2026
      - name: category
        label: 기사 분야
        type: select
        required: true
        options:
          values:
            - name: school
              label: 학교
            - name: local
              label: 지역
            - name: society
              label: 사회
            - name: culture
              label: 문화
            - name: feature
              label: 기획
      - name: author
        label: 기자 이름
        type: string
        required: true
      - name: date
        label: 발행일
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: 기사 요약 (목록에 노출)
        type: text
        required: true
      - name: cover
        label: 대표 사진 (비어 있으면 기본 일러스트)
        type: image
        options:
          media: photos
      - name: status
        label: 발행 상태
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: 비공개 초안
            - name: published
              label: 공개 발행
      - name: featured
        label: 주요 기사 표시
        type: boolean
        default: false
      - name: demo
        label: 시연용 기사 표시
        type: boolean
        default: false
      - name: body
        label: 기사 본문
        type: rich-text
        required: true
        options:
          format: markdown
          media: photos
  - name: issues
    label: 종이신문 아카이브
    type: collection
    path: content/issues
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, date]
      primary: title
    fields:
      - name: title
        label: 호수 / 이름
        type: string
        required: true
      - name: slug
        label: 식별자 (영문·숫자)
        type: string
        required: true
      - name: date
        label: 발행일
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: 소개
        type: text
      - name: pdf
        label: 신문 PDF
        type: file
        options:
          media: papers
          extensions: [pdf]
  - name: site
    label: 사이트 기본 정보
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: 사이트 이름
        type: string
      - name: tagline
        label: 슬로건
        type: string
      - name: about
        label: 소개 글
        type: text
      - name: contact_email
        label: 공개 제보 이메일 (없으면 비워두기)
        type: string
      - name: site_url
        label: 정식 사이트 주소 (개설 후)
        type: string
