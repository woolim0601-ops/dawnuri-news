media:
  - name: photos
    label: 기사 사진
    input: public/media/uploads
    output: /media/uploads
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: papers
    label: 신문 PDF
    input: public/files
    output: /files
    extensions: [pdf]
    rename: safe
content:
  - name: articles
    label: 기사 작성·수정
    type: collection
    path: content/articles
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, category, date, status, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 기사 제목
        type: string
        required: true
      - name: slug
        label: 기사 주소 (영문·숫자·하이픈)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: 예) school-festival-2026
      - name: category
        label: 기사 분야
        type: select
        required: true
        options:
          values:
            - name: school
              label: 학교
            - name: local
              label: 지역
            - name: society
              label: 사회
            - name: culture
              label: 문화
            - name: feature
              label: 기획
      - name: author
        label: 기자 이름
        type: string
        required: true
      - name: reporter_slug
        label: 기자 프로필 연결 ID (선택)
        type: string
        description: 기자 소개 메뉴에서 등록한 영문 ID. 기사 기자명과 프로필 이름이 같다면 생략해도 됩니다.
      - name: date
        label: 발행일
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: 기사 요약 (목록에 노출)
        type: text
        required: true
      - name: cover
        label: 대표 사진 (비어 있으면 기본 일러스트)
        type: image
        options:
          media: photos
      - name: cover_caption
        label: 대표 사진 설명
        type: text
        description: 예) 새롭게 단장한 과학실 내부. 설명이 없으면 사진 아래에 문구가 표시되지 않습니다.
      - name: cover_credit
        label: 대표 사진 출처·촬영자
        type: string
        description: 예) 새벽누리 김OO 기자 (입력하면 사진=... 형식으로 표시)
      - name: status
        label: 발행 상태
        type: select
        required: true
        default: draft
        options:
          values:
            - name: draft
              label: 비공개 초안
            - name: published
              label: 공개 발행
      - name: featured
        label: 주요 기사 표시
        type: boolean
        default: false
      - name: demo
        label: 시연용 기사 표시
        type: boolean
        default: false
      - name: body
        label: 기사 본문
        type: rich-text
        required: true
        options:
          format: markdown
          media: photos
  - name: reporters
    label: 기자 프로필
    type: collection
    path: content/reporters
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [name, role, published]
      primary: name
    fields:
      - name: name
        label: 공개할 기자 이름 또는 필명
        type: string
        required: true
        description: 기사에 표시된 기자 이름과 정확히 같게 입력하거나, 기사에 기자 프로필 연결 ID를 입력하세요.
      - name: slug
        label: 기자 ID (영문 소문자·숫자·하이픈)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: 예) reporter-han. 기자 프로필 주소를 만듭니다.
      - name: role
        label: 직책 / 담당 분야
        type: string
        description: 예) 편집장, 사회부 기자, 영상기자
      - name: bio
        label: 공개 자기소개
        type: text
        description: 활동 분야와 관심 주제 중심으로 짧게 입력하세요. 학교·학년·개인 연락처는 넣지 않는 것을 권장합니다.
      - name: photo
        label: 공개 프로필 사진 (선택)
        type: image
        options:
          media: photos
      - name: published
        label: 홈페이지에 프로필 공개
        type: boolean
        default: false
        description: 본인 동의를 확인한 뒤 켜세요. GitHub Public 저장소에서는 비공개 설정 파일도 다른 사람이 볼 수 있습니다.
  - name: issues
    label: 종이신문 아카이브
    type: collection
    path: content/issues
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, date]
      primary: title
    fields:
      - name: title
        label: 호수 / 이름
        type: string
        required: true
      - name: slug
        label: 식별자 (영문·숫자)
        type: string
        required: true
      - name: date
        label: 발행일
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: 소개
        type: text
      - name: pdf
        label: 신문 PDF
        type: file
        options:
          media: papers
          extensions: [pdf]
  - name: site
    label: 사이트 기본 정보
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: 사이트 이름
        type: string
      - name: tagline
        label: 슬로건
        type: string
      - name: about
        label: 소개 글
        type: text
      - name: contact_email
        label: 공개 제보 이메일 (없으면 비워두기)
        type: string
      - name: site_url
        label: 정식 사이트 주소 (개설 후)
        type: string
